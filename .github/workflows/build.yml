name: Build and Test

# CI runs what can be checked without an ONLYOFFICE: the plain modules under plugin/lib, and the
# agreement between config.json and the code about which editors exist. The Asc.plugin callbacks
# cannot be exercised here at all, which is exactly why every decision that does not need an
# editor lives outside them.
#
# Builds on pull_request only. A push trigger would build the very same commit a second time:
# the PR to next, the push when it merged, the next->main PR, and the push when that merged.
# The PR build is the one anybody reads.
on:
  pull_request:
    branches: [ "main", "next" ]

permissions:
  contents: read

jobs:
  build:
    # Nothing here needs Windows: it is JavaScript and JSON. Linux minutes bill at a fifth of
    # Windows minutes.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Record the runtime that ran this
      run: node --version

    # No npm ci: there are no dependencies, and there should not be. The test runner is Node's
    # own. A lockfile install step that installs nothing is a step that only ever breaks.
    - name: Test
      run: npm test

    - name: Check the plugin manifest parses
      # A malformed config.json makes ONLYOFFICE fail to register the plugin with nothing logged,
      # so it is worth a second of CI to know the file is at least JSON.
      run: node -e "JSON.parse(require('fs').readFileSync('plugin/config.json','utf8')); console.log('config.json parses')"

    - name: Check every script the page loads exists
      # index.html references its scripts by relative path. A renamed or moved file shows up in
      # the editor as a panel that never draws, with nothing in any log.
      run: |
        node - <<'EOF'
        const fs = require('fs'), path = require('path');
        const html = fs.readFileSync('plugin/index.html', 'utf8');
        const srcs = [...html.matchAll(/src="([^"]+)"/g)].map(m => m[1])
          .filter(s => !s.startsWith('http'));
        let bad = 0;
        for (const s of srcs) {
          const p = path.join('plugin', s);
          if (!fs.existsSync(p)) { console.error('missing: ' + p); bad++; }
          else { console.log('ok: ' + p); }
        }
        process.exit(bad ? 1 : 0);
        EOF
