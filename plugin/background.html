<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Nexus PLM</title>

    <!--
        The resident half of the plugin: no window, no UI, and it never draws anything of its own.
        It puts the Nexus PLM tab in the ribbon and runs what the user presses on it, for as long
        as the document is open. config.json types its variation "background", which is what
        keeps this frame alive (see background.js for the measurement behind that).

        Same dependency order as index.html, and for the same reason: no module loader here, so a
        file that reads another's global at load time must come after it.
    -->
    <script type="text/javascript" src="../v1/plugins.js"></script>

    <script type="text/javascript" src="secret.js"></script>

    <script type="text/javascript" src="lib/editors.js"></script>
    <script type="text/javascript" src="lib/client.js"></script>
    <script type="text/javascript" src="lib/paths.js"></script>
    <script type="text/javascript" src="lib/commands.js"></script>
    <script type="text/javascript" src="lib/panel.js"></script>
    <script type="text/javascript" src="lib/toolbar.js"></script>
    <script type="text/javascript" src="lib/host.js"></script>
    <script type="text/javascript" src="lib/markup.js"></script>
    <script type="text/javascript" src="editor.js"></script>
    <script type="text/javascript" src="runner.js"></script>
    <script type="text/javascript" src="background.js"></script>
</head>
<body></body>
</html>
