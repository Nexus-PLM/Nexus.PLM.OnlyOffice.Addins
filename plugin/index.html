<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Nexus PLM</title>

    <!--
        The plugin's frame. ONLYOFFICE loads this page inside the editor, so there is no bundler
        and no module loader: every file is a plain script tag, in dependency order, and each one
        is UMD so the same file is what the tests require.

        plugins.js is served BY the editor, not by this plugin, and it is what defines
        window.Asc.plugin. It has to come first or Asc.plugin.init is registered on an object the
        editor later replaces, and the plugin loads with nothing happening and nothing logged.

        It is loaded from ../v1/, a SIBLING of this plugin's own folder inside sdkjs-plugins -
        checked against every plugin shipped with Desktop Editors 9.4.0, which all reference it
        that way. Not from a CDN: Desktop Editors runs offline, and a plugin whose runtime comes
        over the internet simply does not start on a machine with no route out.
    -->
    <script type="text/javascript" src="../v1/plugins.js"></script>
    <script type="text/javascript" src="../v1/plugins-ui.js"></script>
    <link rel="stylesheet" href="../v1/plugins.css" />

    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="nexus-plm-panel">
        <h1 id="panel-title">Nexus PLM</h1>
        <p id="panel-headline"></p>
        <dl id="panel-rows"></dl>
        <div id="panel-buttons"></div>
    </div>

    <!--
        Written here by tools/install.ps1 from the secret the Addin Service keeps on this machine.
        Loaded as a script, not fetched: a browser refuses fetch from a file:// page to a file://
        URL, but will load a sibling script. Missing is a normal state - the panel then says the
        plugin was not installed properly, rather than failing with a bare 403.
    -->
    <script type="text/javascript" src="secret.js"></script>

    <script type="text/javascript" src="lib/editors.js"></script>
    <script type="text/javascript" src="lib/panel.js"></script>
    <script type="text/javascript" src="lib/client.js"></script>
    <script type="text/javascript" src="ui.js"></script>
    <script type="text/javascript" src="plugin.js"></script>
</body>
</html>
