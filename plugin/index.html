<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Nexus PLM</title>

    <!--
        The Navigator's frame: the vault as a folder tree, docked beside the document — the same
        pane Word docks through a WebView2 (`src/embed` in the React client).

        ONLYOFFICE loads this page inside the editor, so there is no bundler and no module loader:
        every file is a plain script tag, in dependency order, and each module is UMD so the same
        file is what the tests require.

        plugins.js is served BY the editor, not by this plugin, and it is what defines
        window.Asc.plugin. It has to come first or Asc.plugin.init is registered on an object the
        editor later replaces, and the plugin loads with nothing happening and nothing logged.

        It is loaded from ../v1/, a SIBLING of this plugin's own folder inside sdkjs-plugins -
        checked against every plugin shipped with Desktop Editors 9.4.0, which all reference it
        that way. Not from a CDN: Desktop Editors runs offline, and a plugin whose runtime comes
        over the internet simply does not start on a machine with no route out.
    -->
    <script type="text/javascript" src="../v1/plugins.js"></script>
    <script type="text/javascript" src="../v1/plugins-ui.js"></script>
    <link rel="stylesheet" href="../v1/plugins.css" />

    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="np-root">
        <div class="np-search">
            <input id="np-query" type="search" placeholder="Find by item ID…" aria-label="Find by item ID" />
            <button id="np-refresh" class="np-icon-btn" title="Refresh" aria-label="Refresh">&#x21bb;</button>
        </div>

        <div id="np-error" class="np-error" hidden></div>

        <div id="np-tree" class="np-tree" role="tree" aria-label="Folders"></div>

        <div class="np-items" role="listbox" aria-label="Documents">
            <div id="np-band" class="np-band-head">Select a folder</div>
            <div id="np-list"></div>
        </div>

        <div class="np-actions">
            <button id="np-open" disabled>Open</button>
            <button id="np-checkout" disabled>Check Out</button>
            <button id="np-checkin" disabled>Check In</button>
            <button id="np-properties" disabled>Properties</button>
        </div>

        <div id="np-status" class="np-status-strip"></div>
    </div>

    <!--
        Written here by tools/install.ps1 from the secret the Addin Service keeps on this machine.
        Loaded as a script, not fetched: a browser refuses fetch from a file:// page to a file://
        URL, but will load a sibling script. Missing is a normal state - the panel then says the
        plugin was not installed properly, rather than failing with a bare 403.
    -->
    <script type="text/javascript" src="secret.js"></script>

    <!--
        DEPENDENCY ORDER, and it matters: there is no module loader here, so a file that reads
        another's global at load time must come after it. panel.js and toolbar.js both build
        tables from commands.js the moment they are evaluated - listed the other way round they
        throw, the global is never defined, and the panel comes up completely EMPTY with nothing
        on screen to say why. tests/page.test.js holds this order.
    -->
    <script type="text/javascript" src="lib/editors.js"></script>
    <script type="text/javascript" src="lib/client.js"></script>
    <script type="text/javascript" src="lib/paths.js"></script>
    <script type="text/javascript" src="lib/commands.js"></script>
    <script type="text/javascript" src="lib/panel.js"></script>
    <script type="text/javascript" src="lib/navigator.js"></script>
    <script type="text/javascript" src="lib/toolbar.js"></script>
    <script type="text/javascript" src="lib/host.js"></script>
    <script type="text/javascript" src="lib/markup.js"></script>
    <script type="text/javascript" src="editor.js"></script>
    <script type="text/javascript" src="runner.js"></script>
    <script type="text/javascript" src="ui.js"></script>
    <script type="text/javascript" src="plugin.js"></script>
</body>
</html>
